<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <defs>
    <!-- Gradients for Column Headers -->
    <linearGradient id="grad-fwd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-bwd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-eval" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-lg" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="640" fill="#f8fafc" rx="12" />
  <rect x="10" y="10" width="980" height="620" fill="none" stroke="#e2e8f0" stroke-width="2" rx="10" />

  <!-- Main Title & Subtitle -->
  <text x="500" y="40" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">GradMill: Differentiable Optimization, Early Stopping &amp; Evaluation Loop</text>
  <text x="500" y="62" font-family="sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Coupled Forward/Backward Autodiff Mechanics with Exact Deployable Boolean Checkpointing</text>

  <!-- COLUMN 1: FORWARD PASS & LOSSES (Left) -->
  <g transform="translate(25, 85)">
    <!-- Column Panel Background -->
    <rect width="290" height="530" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" rx="10" />
    <!-- Column Header -->
    <rect width="290" height="44" fill="url(#grad-fwd)" rx="10" />
    <path d="M 0 34 L 290 34 L 290 44 L 0 44 Z" fill="url(#grad-fwd)" />
    <text x="145" y="27" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1. Forward Pass &amp; Losses</text>
    <text x="145" y="39" font-family="sans-serif" font-size="10" font-weight="500" fill="#dbafe5" fill-opacity="0.9" text-anchor="middle">Soft Differentiable Simulation (ti.ad.Tape)</text>

    <!-- Card 1: Network / Param Input -->
    <rect x="15" y="58" width="260" height="96" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="30" y="80" font-family="sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Trajectory Parameters (δ)</text>
    <text x="30" y="100" font-family="monospace" font-size="12" font-weight="600" fill="#0f172a">δ^(i) ∈ ℝ^( (T-1) × 3 )</text>
    <text x="30" y="118" font-family="sans-serif" font-size="11" fill="#475569">PyTorch displacement field tensors</text>
    <text x="30" y="136" font-family="sans-serif" font-size="11" font-weight="600" fill="#2563eb">Transferred to Taichi field memory</text>

    <!-- Card 2: Subgradient Safety Gates -->
    <rect x="15" y="170" width="260" height="114" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="30" y="192" font-family="sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Subgradient Safety Gates</text>
    <text x="30" y="212" font-family="sans-serif" font-size="11" font-weight="600" fill="#b91c1c">• Kinematic Speed Clipping:</text>
    <text x="30" y="228" font-family="monospace" font-size="11" fill="#334155">  ||δ_t|| ≤ v_feed / v_rapid</text>
    <text x="30" y="246" font-family="sans-serif" font-size="11" font-weight="600" fill="#b91c1c">• Z-Floor Collision Clamp:</text>
    <text x="30" y="262" font-family="monospace" font-size="11" fill="#334155">  z_base(t) ≥ z_part_bottom - ε</text>
    <text x="30" y="276" font-family="sans-serif" font-size="10" fill="#64748b">Projects onto feasible machine subspace</text>

    <!-- Card 3: Differentiable CSG Carving -->
    <rect x="15" y="300" width="260" height="114" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="30" y="322" font-family="sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Differentiable CSG Carving</text>
    <text x="30" y="342" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">with ti.ad.Tape(loss=sim.loss):</text>
    <text x="30" y="360" font-family="sans-serif" font-size="11" fill="#334155">Unrolls T cutting operations jointly</text>
    <text x="30" y="378" font-family="sans-serif" font-size="11" font-weight="600" fill="#2563eb">Log-Sum-Exp Smooth Union:</text>
    <text x="30" y="394" font-family="monospace" font-size="11" fill="#1e40af">Φ_{t+1} = smooth_max(Φ_t, -φ; k)</text>

    <!-- Card 4: Terminal Soft Loss -->
    <rect x="15" y="430" width="260" height="86" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="30" y="452" font-family="sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Terminal Geometry Loss</text>
    <text x="30" y="472" font-family="sans-serif" font-size="11" fill="#334155">Evaluated on final soft stock Φ_T:</text>
    <text x="30" y="490" font-family="monospace" font-size="11" font-weight="600" fill="#b91c1c">L_geom = w_g*gouge² + w_r*res²</text>
    <text x="30" y="506" font-family="sans-serif" font-size="10" fill="#64748b">Provides smooth optimization landscape</text>
  </g>

  <!-- ARROW 1: Forward Loss to Backward Pass (Bottom Left to Bottom Middle) -->
  <g transform="translate(315, 473)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)" />
    <text x="12" y="-8" font-family="sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">Loss</text>
  </g>

  <!-- COLUMN 2: BACKWARD PASS & OPTIMIZATION (Middle) -->
  <g transform="translate(340, 85)">
    <!-- Column Panel Background -->
    <rect width="290" height="530" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" rx="10" />
    <!-- Column Header -->
    <rect width="290" height="44" fill="url(#grad-bwd)" rx="10" />
    <path d="M 0 34 L 290 34 L 290 44 L 0 44 Z" fill="url(#grad-bwd)" />
    <text x="145" y="27" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2. Backward Pass &amp; Optim</text>
    <text x="145" y="39" font-family="sans-serif" font-size="10" font-weight="500" fill="#e9d5ff" text-anchor="middle">Analytical Autodiff &amp; Adam Update</text>

    <!-- Card 1: Autodiff Backpropagation -->
    <rect x="15" y="430" width="260" height="86" fill="#ffffff" stroke="#f3e8ff" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="30" y="452" font-family="sans-serif" font-size="14" font-weight="700" fill="#6d28d9">Autodiff Backpropagation</text>
    <text x="30" y="472" font-family="sans-serif" font-size="11" fill="#334155">Reverse tape unroll across T steps</text>
    <text x="30" y="490" font-family="monospace" font-size="11" font-weight="600" fill="#581c87">g^(i) = ∇_δ L_geom(δ^(i))</text>
    <text x="30" y="506" font-family="sans-serif" font-size="10" fill="#64748b">Exact analytic gradients via Taichi</text>

    <!-- Arrow UP inside Middle Column -->
    <line x1="145" y1="430" x2="145" y2="415" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />

    <!-- Card 2: Gradient Norm Clipping -->
    <rect x="15" y="300" width="260" height="114" fill="#ffffff" stroke="#f3e8ff" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="30" y="322" font-family="sans-serif" font-size="14" font-weight="700" fill="#6d28d9">Gradient L2 Norm Clipping</text>
    <text x="30" y="342" font-family="sans-serif" font-size="11" fill="#334155">Sharp CSG boundaries cause spikes</text>
    <text x="30" y="360" font-family="monospace" font-size="11" font-weight="600" fill="#b91c1c">if ||g||_2 &gt; c_grad (0.5):</text>
    <text x="30" y="378" font-family="monospace" font-size="11" font-weight="600" fill="#b91c1c">  g̃ = c_grad * (g / ||g||_2)</text>
    <text x="30" y="394" font-family="sans-serif" font-size="10" font-weight="600" fill="#059669">Prevents NaN divergence &amp; oscillation</text>

    <!-- Arrow UP inside Middle Column -->
    <line x1="145" y1="300" x2="145" y2="285" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />

    <!-- Card 3: Adam Optimizer & Curriculum -->
    <rect x="15" y="170" width="260" height="114" fill="#ffffff" stroke="#f3e8ff" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="30" y="192" font-family="sans-serif" font-size="14" font-weight="700" fill="#6d28d9">Adam Optimizer Step</text>
    <text x="30" y="212" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">δ^(i+1) ← Adam(δ^(i), g̃; α=1e-3)</text>
    <text x="30" y="230" font-family="sans-serif" font-size="11" fill="#334155">LR α is most critical hyperparameter</text>
    <text x="30" y="248" font-family="sans-serif" font-size="11" font-weight="600" fill="#6d28d9">• Smoothness k-Annealing (explore→sharp)</text>
    <text x="30" y="264" font-family="sans-serif" font-size="11" font-weight="600" fill="#6d28d9">• Loss Weight Warmup (delay regularizer)</text>

    <!-- Card 4: Iteration Loop Control -->
    <rect x="15" y="58" width="260" height="96" fill="#ffffff" stroke="#f3e8ff" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="30" y="80" font-family="sans-serif" font-size="14" font-weight="700" fill="#6d28d9">Iteration Controller</text>
    <text x="30" y="100" font-family="monospace" font-size="12" font-weight="600" fill="#0f172a">i ← i + 1</text>
    <text x="30" y="118" font-family="sans-serif" font-size="11" fill="#475569">While i &lt; N_iters (default 200)</text>
    <text x="30" y="136" font-family="sans-serif" font-size="11" font-weight="600" fill="#2563eb">Loops back to update forward tape</text>
  </g>

  <!-- ARROW UP inside Middle Column from Adam to Controller -->
  <line x1="485" y1="255" x2="485" y2="239" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- FEEDBACK ARROW: Loop Back from Middle Column Top to Left Column Top -->
  <g transform="translate(340, 133)">
    <path d="M 0 0 L -25 0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <text x="-12" y="-8" font-family="sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">Next δ</text>
  </g>

  <!-- BRANCH ARROW: From Middle Column across to Right Column (Periodic Eval) -->
  <g transform="translate(630, 133)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <text x="12" y="-14" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">Every K Iters</text>
    <text x="12" y="-2" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">&amp; Final Step</text>
  </g>

  <!-- COLUMN 3: EARLY STOPPING & EXACT EVAL (Right) -->
  <g transform="translate(655, 85)">
    <!-- Column Panel Background -->
    <rect width="320" height="530" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" rx="10" />
    <!-- Column Header -->
    <rect width="320" height="44" fill="url(#grad-eval)" rx="10" />
    <path d="M 0 34 L 320 34 L 320 44 L 0 44 Z" fill="url(#grad-eval)" />
    <text x="160" y="27" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3. Early Stopping &amp; Exact Eval</text>
    <text x="160" y="39" font-family="sans-serif" font-size="10" font-weight="500" fill="#a7f3d0" text-anchor="middle">Hard Boolean Carving Authority (No Soft Bias)</text>

    <!-- Card 1: Canonical Reset & Hard Carve -->
    <rect x="15" y="58" width="290" height="106" fill="#ffffff" stroke="#d1fae5" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="30" y="80" font-family="sans-serif" font-size="14" font-weight="700" fill="#047857">Canonical Reset &amp; Hard Carve</text>
    <text x="30" y="100" font-family="sans-serif" font-size="11" fill="#334155">Reset tool start to canonical x_0=(0.5,0.5,1.0)</text>
    <text x="30" y="118" font-family="monospace" font-size="11" font-weight="600" fill="#0f172a">Φ_{t+1}^hard = max(Φ_t^hard, -φ_sharp)</text>
    <text x="30" y="136" font-family="sans-serif" font-size="11" font-weight="600" fill="#b91c1c">Exact boolean union (zero over-erosion)</text>
    <text x="30" y="152" font-family="sans-serif" font-size="10" fill="#64748b">Ensures deployable scoring consistency across seeds</text>

    <!-- Card 2: Deployable Metric Scoring -->
    <rect x="15" y="176" width="290" height="96" fill="#ffffff" stroke="#d1fae5" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <text x="30" y="198" font-family="sans-serif" font-size="14" font-weight="700" fill="#047857">Deployable Metric Scoring</text>
    <text x="30" y="218" font-family="sans-serif" font-size="11" fill="#334155">Evaluate remaining stock vs analytic target:</text>
    <text x="30" y="236" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f172a">• Volumetric Dice Coefficient (Primary)</text>
    <text x="30" y="252" font-family="sans-serif" font-size="11" fill="#475569">• Average Surface Distance (ASD)</text>
    <text x="30" y="268" font-family="sans-serif" font-size="11" fill="#475569">• 95th-Percentile Hausdorff (HD95)</text>

    <!-- Card 3: Early Stopping / Best-Checkpoint Gating -->
    <rect x="15" y="284" width="290" height="130" fill="#ffffff" stroke="#059669" stroke-width="2" rx="8" filter="url(#shadow-lg)" />
    <text x="160" y="308" font-family="sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">Early-Stopping Checkpoint Gate</text>
    <text x="160" y="328" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Soft surrogate loss degrades hard Dice over time</text>
    <text x="160" y="352" font-family="monospace" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">Is Dice_hard^(i) &gt; Best Dice ?</text>
    
    <!-- YES Branch Badge -->
    <rect x="30" y="368" width="120" height="36" fill="#dcfce7" stroke="#10b981" stroke-width="1" rx="6" />
    <text x="90" y="383" font-family="sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">YES (Improvement)</text>
    <text x="90" y="397" font-family="sans-serif" font-size="9" font-weight="600" fill="#065f46" text-anchor="middle">Snapshot pre-step δ^(i)</text>

    <!-- NO Branch Badge -->
    <rect x="170" y="368" width="120" height="36" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6" />
    <text x="230" y="383" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">NO (Degradation)</text>
    <text x="230" y="397" font-family="sans-serif" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Discard soft step</text>

    <!-- Card 4: Termination & Snapshot Output -->
    <rect x="15" y="426" width="290" height="90" fill="#ffffff" stroke="#059669" stroke-width="2" rx="8" filter="url(#shadow)" />
    <text x="30" y="448" font-family="sans-serif" font-size="14" font-weight="700" fill="#047857">Termination &amp; Best Snapshot</text>
    <text x="30" y="468" font-family="sans-serif" font-size="11" font-weight="700" fill="#b91c1c">NO End-of-Training Re-Evaluation:</text>
    <text x="30" y="484" font-family="sans-serif" font-size="11" fill="#334155">GPU atomic-add reduction has ±0.01-0.05</text>
    <text x="30" y="500" font-family="sans-serif" font-size="11" fill="#334155">associativity variance. Directly output the</text>
    <text x="30" y="512" font-family="sans-serif" font-size="11" font-weight="600" fill="#047857">snapshotted trajectory &amp; measured metrics.</text>
  </g>
</svg>
