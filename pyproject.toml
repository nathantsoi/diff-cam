[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-cam"
version = "0.2.0"
description = "Differentiable stock removal and delta-trajectory optimization"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11", "taichi>=1.7.4,<1.8"]

[tool.setuptools.packages.find]
include = ["simulator*", "algorithms*", "cam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
