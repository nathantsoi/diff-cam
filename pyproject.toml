[project]
name = "diff-cam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "autopep8>=2.3.2",
    "ffmpeg>=1.4",
    "flax>=0.10.7",
    "gym>=0.23.0",
    "gymnasium>=0.29.1",
    "matplotlib>=3.10.9",
    "mujoco>=3.9.0",
    "pufferlib>=3.0.0",
    "pyyaml>=6.0.3",
    "rtree>=1.4.1",
    "scipy>=1.15.3",
    "taichi>=1.6.0",
    "tensorboard>=2.20.0",
    "torch>=2.9.1",
    "trimesh>=4.11.1",
    "tyro>=1.0.5",
]

[tool.setuptools.packages.find]
include = ["cam_env*", "simulator*", "algorithms*", "cam*", "eval*"]

[tool.pytest.ini_options]
# Only collect the unit-test suite under tests/. The repo-root test_perf.py and
# test_mpi.py are standalone benchmark / MPI scripts, not pytest tests.
testpaths = ["tests"]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu128"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
